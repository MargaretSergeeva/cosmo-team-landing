<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Cosmo Team — IT-Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0E1A;--panel:#141A2E;--line:#232A45;--text:#EDEFF7;--muted:#9AA3C0;--nebula:#8B70FF;--nebula-soft:#2A2259;--glow:#4FD1E8;--nova:#FFB547}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/24px Inter,system-ui,sans-serif}
a{color:var(--nebula)}a:hover{color:#B3A3FF}
h1,h2,h3,.disp{font-family:"Space Grotesk",sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:96px 24px}
.eyebrow{font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:12px;line-height:16px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.eyebrow.c{color:var(--glow)}
h2{margin:0;font-weight:600;font-size:36px;line-height:42px}
.muted{color:var(--muted)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:12px}
.card h3{margin:0;font-weight:600;font-size:19px;line-height:26px}
.card p{margin:0;font-size:15px;line-height:22px;color:var(--muted)}
.band{background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.band .card{background:var(--bg)}
.btn{background:var(--nebula);color:var(--bg);text-decoration:none;font-weight:600;padding:14px 24px;border-radius:12px;min-height:48px;display:inline-flex;align-items:center;justify-content:center;border:0;font-size:16px;cursor:pointer;font-family:inherit}
.btn:hover{color:var(--bg);background:#9C86FF}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:500}
.head{border-bottom:1px solid var(--line)}
.head .in{max-width:1200px;margin:0 auto;padding:16px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.logo{text-decoration:none;display:flex;flex-direction:column;gap:2px}
.logo b{font-family:"Space Grotesk",sans-serif;font-size:20px;line-height:24px;color:var(--text)}
nav{display:flex;flex-wrap:wrap;gap:24px;font-size:15px}
nav a{color:var(--muted);text-decoration:none}nav a:hover{color:var(--text)}
.flags{display:flex;gap:6px}
.flags button{width:44px;height:44px;padding:0;border-radius:6px;cursor:pointer;background:transparent;border:1px solid var(--line);opacity:.6;display:inline-flex;align-items:center;justify-content:center}
.flags button[aria-pressed=true]{background:var(--nebula-soft);border-color:var(--nebula);opacity:1}
.hero{position:relative;overflow:hidden}
.hero .wrap{position:relative;display:flex;flex-direction:column;gap:24px;padding-bottom:88px}
.hero h1{margin:0;max-width:820px;font-weight:700;font-size:clamp(36px,6vw,60px);line-height:1.08}
.hero h1 span{color:var(--nebula)}
.hero p.sub{margin:0;max-width:640px;font-size:19px;line-height:30px;color:var(--muted)}
.star{position:absolute;border-radius:999px;background:var(--text)}
.orbit{position:absolute;border-radius:999px;border:1px solid var(--line)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;max-width:760px;padding-top:40px}
.facts div{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:4px}
.facts b{font-family:"Space Grotesk",sans-serif;font-size:32px;line-height:36px}
.facts span{font-size:14px;line-height:20px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:999px;background:var(--nova)}
.check{display:flex;flex-wrap:wrap;gap:40px}
.check .l{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:24px}
.check .l h2{font-weight:700;font-size:clamp(32px,4.5vw,48px);line-height:1.1}
.check .r{flex:1 1 320px;min-width:0;background:var(--nebula-soft);border:1px solid var(--nebula);border-radius:12px;padding:32px;display:flex;flex-direction:column;gap:16px;justify-content:center}
.li{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:24px}
.num{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:14px;color:var(--nebula)}
.ava{width:64px;height:64px;border-radius:999px;background:var(--nebula-soft);border:1px solid var(--nebula)}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;flex:999 1 480px;min-width:0}
form .f{display:flex;flex-direction:column;gap:6px}
form .full{grid-column:1/-1}
label{font-size:14px;color:var(--muted)}
input,textarea{font:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--text);padding:12px 14px;min-height:44px}
input:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
footer .in{max-width:1200px;margin:0 auto;padding:24px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;font-size:13px;color:var(--muted)}
footer a{color:var(--muted)}
.draft{background:var(--nova);color:var(--bg);text-align:center;font-size:13px;padding:6px 16px;font-weight:600}
</style>
</head>

<section id="check"><div class="wrap check">

    <a class="btn" href="#contact" style="margin-top:8px" data-k="heroCta1"></a>
  </div>
</div></section>

<section id="services" style="border-top:1px solid var(--line)"><div class="wrap" style="display:flex;flex-direction:column;gap:40px">
  <div style="display:flex;flex-direction:column;gap:8px"><span class="eyebrow" data-k="svcEyebrow"></span><h2 data-k="svcTitle"></h2></div>
  <div class="grid" id="svcs"></div>

<section id="team" class="band"><div class="wrap" style="display:flex;flex-direction:column;gap:40px">

  <div class="grid" id="team-list"></div>
</div></section>

<section id="contact"><div class="wrap" style="display:flex;flex-wrap:wrap;gap:48px">

    <div class="full" style="display:flex;flex-wrap:wrap;gap:16px;align-items:center">
      <button class="btn" type="submit" data-k="fSend"></button>
      <span class="muted" style="font-size:13px;line-height:18px" data-k="fNote"></span>
    </div>
  </form>
</div></section>

<footer style="border-top:1px solid var(--line)"><div class="in">
  <span>© 2026 Cosmo Team · Berlin</span>
  <div style="display:flex;gap:24px"><a href="#top">Impressum</a><a href="#top">Datenschutz</a></div>
