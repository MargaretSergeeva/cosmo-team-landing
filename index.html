<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Kosmo Team — IT-Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B1026;--panel:#141B38;--slab:#232C5A;--line:#2A3358;--text:#F2EEE3;--muted:#A9AFC7;--gold:#D4A84B;--gold-soft:#F0D9A0;--glow:#4FD1E8;--earth-deep:#16506A;--nebula:var(--gold);--nebula-soft:var(--slab);--nova:var(--gold)}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(1px 1px at 20px 30px, rgba(237,239,247,0.6), transparent), radial-gradient(1px 1px at 120px 80px, rgba(237,239,247,0.4), transparent), radial-gradient(1.5px 1.5px at 260px 160px, rgba(237,239,247,0.5), transparent), radial-gradient(1px 1px at 340px 40px, rgba(237,239,247,0.35), transparent), radial-gradient(1px 1px at 80px 220px, rgba(237,239,247,0.45), transparent), radial-gradient(1.5px 1.5px at 190px 300px, rgba(237,239,247,0.4), transparent), radial-gradient(1px 1px at 310px 260px, rgba(237,239,247,0.5), transparent), radial-gradient(1px 1px at 380px 350px, rgba(237,239,247,0.3), transparent), radial-gradient(1px 1px at 150px 370px, rgba(237,239,247,0.4), transparent), radial-gradient(1px 1px at 40px 330px, rgba(237,239,247,0.3), transparent);background-size:400px 400px;color:var(--text);font:16px/24px Inter,system-ui,sans-serif}
a{color:var(--nebula)}a:hover{color:var(--gold-soft)}
h1,h2,h3,.disp{font-family:"Space Grotesk",sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:96px 24px}
.eyebrow{font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:12px;line-height:16px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.eyebrow.c{color:var(--glow)}
h2{margin:0;font-weight:600;font-size:36px;line-height:42px}
.muted{color:var(--muted)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:12px}
.card h3{margin:0;font-weight:600;font-size:19px;line-height:26px}
.card p{margin:0;font-size:15px;line-height:22px;color:var(--muted)}
.band{background:rgba(20,27,56,.85);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.band .card{background:var(--bg)}
.btn{background:var(--nebula);color:var(--bg);text-decoration:none;font-weight:600;padding:14px 24px;border-radius:12px;min-height:48px;display:inline-flex;align-items:center;justify-content:center;border:0;font-size:16px;cursor:pointer;font-family:inherit}
.btn:hover{color:var(--bg);background:var(--gold-soft)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:500}
.head{border-bottom:1px solid var(--line)}
.head .in{max-width:1200px;margin:0 auto;padding:16px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.logo{text-decoration:none;display:flex;flex-direction:column;gap:2px}
.logo b{font-family:"Space Grotesk",sans-serif;font-size:28px;line-height:32px;color:var(--text)}
nav{display:flex;flex-wrap:wrap;gap:24px;font-size:15px}
nav a{color:var(--muted);text-decoration:none}nav a:hover{color:var(--text)}
.flags{display:flex;gap:6px}
.flags button{width:44px;height:44px;padding:0;border-radius:6px;cursor:pointer;background:transparent;border:1px solid var(--line);opacity:.6;display:inline-flex;align-items:center;justify-content:center}
.flags button[aria-pressed=true]{background:var(--nebula-soft);border-color:var(--nebula);opacity:1}
.hero{position:relative;overflow:hidden}
.hero .wrap{position:relative;display:flex;flex-direction:column;gap:24px;padding-bottom:88px}
.hero h1{margin:0;max-width:820px;font-weight:700;font-size:clamp(36px,6vw,60px);line-height:1.08}
.hero h1 span{color:var(--nebula)}
.hero p.sub{margin:0;max-width:640px;font-size:19px;line-height:30px;color:var(--muted)}
.star{position:absolute;border-radius:999px;background:var(--text)}
.orbit{position:absolute;border-radius:999px;border:1px solid var(--line)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;max-width:880px;padding-top:40px}
.facts div{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:4px}
.facts b{font-family:"Space Grotesk",sans-serif;font-size:32px;line-height:36px}
.facts span{font-size:14px;line-height:20px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:999px;background:var(--nova)}
.check{display:flex;flex-wrap:wrap;gap:40px}
.check .l{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:24px}
.check .l h2{font-weight:700;font-size:clamp(32px,4.5vw,48px);line-height:1.1}
.check .r{flex:1 1 320px;min-width:0;background:var(--nebula-soft);border:1px solid var(--nebula);border-radius:12px;padding:32px;display:flex;flex-direction:column;gap:16px;justify-content:center}
.li{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:24px}
.num{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:14px;color:var(--glow)}
.ava{width:64px;height:64px;border-radius:999px;background:var(--earth-deep);border:1px solid var(--glow)}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;flex:999 1 480px;min-width:0}
form .f{display:flex;flex-direction:column;gap:6px}
form .full{grid-column:1/-1}
label{font-size:14px;color:var(--muted)}
input,textarea{font:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--text);padding:12px 14px;min-height:44px}
input:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
footer .in{max-width:1200px;margin:0 auto;padding:24px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;font-size:13px;color:var(--muted)}
footer a{color:var(--muted)}
.draft{background:var(--nova);color:var(--bg);text-align:center;font-size:13px;padding:6px 16px;font-weight:600}
.qlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.q{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding:20px 24px;border-top:1px solid var(--line)}
.q:first-child{border-top:0}
.q p{margin:0;flex:999 1 420px;min-width:0;font-size:16px;line-height:24px}
.q .n{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;color:var(--glow);margin-right:10px}
.opts{display:flex;gap:8px;flex:1 0 auto}
.opts button{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--text);font:inherit;font-size:14px;cursor:pointer}
.opts button[aria-pressed=true]{background:var(--nebula);border-color:var(--nebula);color:var(--bg);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.qres{background:var(--nebula-soft);border:1px solid var(--nebula);border-radius:12px;padding:32px;display:flex;flex-direction:column;gap:16px}
</style>
</head>
<body>
<div class="draft" data-k="draft"></div>

<header class="head"><div class="in">
  <a class="logo" href="#top" aria-label="Kosmo Team" style="flex-direction:row;align-items:center;gap:12px"><svg width="44" height="44" viewBox="0 0 40 40" aria-hidden="true" style="flex-shrink: 0;"><ellipse cx="20" cy="20" rx="17" ry="7" fill="none" stroke="#4FD1E8" stroke-width="1.5" transform="rotate(-25 20 20)"></ellipse><circle cx="20" cy="20" r="7" fill="#D4A84B"></circle><circle cx="29.9" cy="10.4" r="3.2" fill="#4FD1E8"></circle></svg><span style="display:flex;flex-direction:column;gap:2px"><b><span style="color:var(--gold)">Kosmo</span> Team</b><span class="eyebrow" style="font-size:11px">IT &amp; Digital Consulting</span></span></a>
  <nav aria-label="Main">
    <a href="#check" data-k="navCheck"></a><a href="#services" data-k="navServices"></a><a href="#team" data-k="navTeam"></a><a href="insights/" data-k="navInsights"></a><a href="#contact" data-k="navContact"></a>
  </nav>
  <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
    <div class="flags" role="group" aria-label="Language">
      <button type="button" data-lang="ru" aria-label="Русский"><svg width="28" height="19" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="6.67" fill="#fff"/><rect y="6.67" width="30" height="6.67" fill="#0039A6"/><rect y="13.33" width="30" height="6.67" fill="#D52B1E"/></svg></button>
      <button type="button" data-lang="en" aria-label="English"><svg width="28" height="19" viewBox="0 0 60 40" aria-hidden="true"><rect width="60" height="40" fill="#012169"/><path d="M0 0L60 40M60 0L0 40" stroke="#fff" stroke-width="8"/><path d="M0 0L60 40M60 0L0 40" stroke="#C8102E" stroke-width="3"/><path d="M30 0V40M0 20H60" stroke="#fff" stroke-width="12"/><path d="M30 0V40M0 20H60" stroke="#C8102E" stroke-width="7"/></svg></button>
      <button type="button" data-lang="de" aria-label="Deutsch"><svg width="28" height="19" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="6.67" fill="#000"/><rect y="6.67" width="30" height="6.67" fill="#D00"/><rect y="13.33" width="30" height="6.67" fill="#FFCE00"/></svg></button>
    </div>
    <a class="btn" href="#contact" style="padding:10px 18px;min-height:44px;font-size:15px" data-k="navCta"></a>
  </div>
</div></header>

<section id="top" class="hero">
  <div aria-hidden="true">
    <span class="star" style="left:8%;top:18%;width:3px;height:3px;opacity:.5"></span>
    <span class="star" style="left:22%;top:72%;width:2px;height:2px;opacity:.4"></span>
    <span class="star" style="left:47%;top:12%;width:2px;height:2px;opacity:.5"></span>
    <span class="star" style="left:63%;top:84%;width:3px;height:3px;opacity:.3"></span>
    <span class="star" style="left:78%;top:26%;width:2px;height:2px;opacity:.6"></span>

    <span class="orbit" style="right:-60px;top:160px;width:280px;height:280px"></span>
  </div>
  <div class="wrap">
    <span class="eyebrow c" data-k="eyebrow"></span>
    <h1><span style="color:inherit" data-k="heroA"></span> <span data-k="heroB"></span></h1>
    <p class="sub" data-k="heroSub"></p>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-top:8px;max-width:560px">
      <a class="btn" href="#check" data-k="heroCta1" style="text-align:center;padding:14px 12px"></a><a class="btn ghost" href="#quiz" id="hero-quiz" data-k="heroCta2" style="text-align:center;padding:14px 12px;border-color:var(--glow);color:var(--glow);font-weight:600"></a>
    </div>
  </div>
</section>


<section id="services" style="border-top:1px solid var(--line)"><div class="wrap" style="display:flex;flex-direction:column;gap:40px">
  <div style="display:flex;flex-direction:column;gap:8px"><span class="eyebrow" data-k="svcEyebrow"></span><h2 data-k="svcTitle"></h2></div>
  <div class="grid" id="svcs"></div>
</div></section>

<section id="results" style="border-top:1px solid var(--line)"><div class="wrap" style="display:flex;flex-direction:column;gap:40px">
  <div style="display:flex;flex-direction:column;gap:8px"><span class="eyebrow c" data-k="outEyebrow"></span><h2 data-k="outTitle"></h2><p class="muted" style="margin:0;max-width:640px" data-k="outSub"></p></div>
  <div class="grid" id="out-list"></div>
</div></section>

<section class="band"><div class="wrap" style="display:flex;flex-direction:column;gap:40px;padding:80px 24px">
  <div style="display:flex;flex-direction:column;gap:8px"><span class="eyebrow" data-k="painsEyebrow"></span><h2 data-k="painsTitle"></h2></div>
  <div class="grid" id="pains"></div>
</div></section>

<section id="quiz"><div class="wrap" style="display:flex;flex-direction:column;gap:32px">
  <div style="display:flex;flex-direction:column;gap:8px"><span class="eyebrow c" id="qz-eyebrow"></span><h2 id="qz-title"></h2><p class="muted" style="margin:0;max-width:640px" id="qz-sub"></p></div>

    <button class="btn" type="button" id="qz-show"></button>

</div></section>

<section id="check"><div class="wrap check">

  </div>

<section aria-labelledby="fund-title"><div class="wrap" style="padding:72px 24px">

  <div class="grid" id="meth-list"></div>
</div></section>

</div></footer>

<script>
